<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TechEnglish">
  <meta name="theme-color" content="#0d47a1">
  <title>Hành Trình Kỹ Thuật Viên</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Thanh trạng thái -->
  <div id="hud">
    <div class="hbox">
      <div class="lv">Lv <b id="hLvl">1</b></div>
      <div class="hmid">
        <div class="xpbar"><i id="hXp"></i></div>
        <div class="hrow"><span>🪙 <b id="hCoins">0</b></span><span id="hClock"></span></div>
        <div id="hRegion"></div>
      </div>
    </div>
    <div class="hmenu">
      <button id="mDict" aria-label="Từ điển">📖</button>
      <button id="mBag" aria-label="Balo">🎒</button>
      <button id="mQuest" aria-label="Nhiệm vụ">📜</button>
      <button id="mMap" aria-label="Bản đồ">🗺️</button>
      <button id="mSet" aria-label="Cài đặt">⚙️</button>
    </div>
  </div>
  <div id="hQuest"></div>
  <canvas id="mini" width="240" height="180"></canvas>
  <div id="banner"></div>
  <button id="phone" aria-label="Nghe điện thoại">📞<small>Nghe máy</small></button>
  <div id="hotbar"></div>
  <div id="hbname"></div>
  <div id="toasts"></div>

  <!-- Điều khiển -->
  <div id="joyzone"></div>
  <div id="joy"><div id="joyknob"></div></div>
  <button id="btnA" class="dim">✋<small>—</small></button>

  <!-- Hộp thoại -->
  <div id="modal"><div id="panel" class="panel"></div></div>

  <!-- Màn hình tiêu đề -->
  <div id="title">
    <div class="tbox">
      <div class="tlogo">👷‍♂️🔌📖</div>
      <h1>Hành Trình<br>Kỹ Thuật Viên</h1>
      <p class="tsub">English &amp; Electronics Quest</p>
      <p class="tdesc">Khám phá thế giới rộng lớn theo giờ thực, săn từ vựng tiếng Anh, sưu tầm linh kiện điện tử, trồng trọt, và luyện giao tiếp với khách hàng.</p>
      <button id="tContinue" class="btn big">Chơi tiếp ▶</button>
      <button id="tNew" class="btn big ghost">Chơi mới</button>
      <p class="tnote">Dành cho điện thoại &amp; iPad · Nên xoay ngang màn hình</p>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/data/words.js"></script>
  <script src="js/data/components.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/data/farm.js"></script>
  <script src="js/data/convos.js"></script>
  <script src="js/data/hvac_questions.js"></script>
  <script src="js/data/hvac_listening.js"></script>
  <script src="js/data/teashops.js"></script>
  <script src="js/data/regions.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/world.js"></script>
  <script src="js/work.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hvac.js"></script>
  <script src="js/tea.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
